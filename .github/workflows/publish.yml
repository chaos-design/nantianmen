name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Vercel environment to deploy
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'push' && 'production' || inputs.target }}
  cancel-in-progress: false

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      # 生产发布前的最后一道覆盖率闸门，与 ci.yml 保持一致。
      - name: Enforce coverage thresholds
        run: pnpm test:coverage

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: deploy
    needs:
      - quality
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    environment:
      name: ${{ (github.event_name == 'push' || inputs.target == 'production') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Vercel CLI
        run: |
          pnpm dlx vercel@latest --version

      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            target="production"
          else
            target="$REQUESTED_TARGET"
          fi

          if [[ "$target" == "production" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployments are only allowed from main."
            exit 1
          fi

          if [[ "$target" == "production" ]]; then
            base_version="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
            if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::package.json must contain a numeric major.minor version."
              exit 1
            fi
            version="v${base_version}.${GITHUB_RUN_NUMBER}"
          else
            version="preview-${GITHUB_RUN_NUMBER}"
          fi

          archive="${version}-vercel-output.tar.gz"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Validate Vercel credentials
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Pull Vercel environment
        run: |
          pnpm dlx vercel@latest pull \
            --yes \
            --environment="${{ steps.release.outputs.target }}" \
            --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        env:
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "production" ]]; then
            pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest build --token="$VERCEL_TOKEN"
          fi

      - name: Package Vercel output
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: tar -czf "$ARCHIVE" .vercel/output

      - name: Upload versioned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.version }}-vercel-output-attempt-${{ github.run_attempt }}
          path: ${{ steps.release.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Deploy prebuilt output
        id: deploy
        env:
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "production" ]]; then
            deployment_url="$(pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          else
            deployment_url="$(pnpm dlx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")"
          fi

          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1)"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "::error::Vercel did not return a valid deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        env:
          TARGET: ${{ steps.release.outputs.target }}
          VERSION: ${{ steps.release.outputs.version }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Vercel deployment"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`$TARGET\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| URL | $DEPLOYMENT_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: steps.release.outputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ARCHIVE" --clobber
          else
            gh release create "$VERSION" "$ARCHIVE#Vercel Build Output" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes
          fi
