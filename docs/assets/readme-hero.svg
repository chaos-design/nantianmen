    <rect x="38" y="286" width="62" height="12" rx="6" fill="#DFA455"/>
    <rect x="38" y="312" width="92" height="12" rx="6" fill="#E7EEF4"/>

    <rect x="162" y="88" width="122" height="286" rx="14" fill="#FFFDF8"/>
    <rect x="182" y="116" width="64" height="12" rx="6" fill="#162A3E"/>
    <rect x="182" y="142" width="82" height="7" rx="3.5" fill="#D5CEC4"/>
    <rect x="182" y="170" width="72" height="8" rx="4" fill="#268772"/>
    <rect x="182" y="196" width="78" height="7" rx="3.5" fill="#C7D4D1"/>
    <rect x="182" y="216" width="66" height="7" rx="3.5" fill="#C7D4D1"/>
    <rect x="182" y="250" width="78" height="8" rx="4" fill="#268772"/>
    <rect x="182" y="276" width="74" height="7" rx="3.5" fill="#C7D4D1"/>
