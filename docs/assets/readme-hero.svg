    <text class="tiny" x="187" y="348" fill="#8D7761">A4 Preview</text>

    <rect x="310" y="88" width="100" height="286" rx="18" fill="#07111F"/>
    <circle cx="360" cy="138" r="28" fill="#43D4B7" opacity="0.9"/>
    <rect x="332" y="184" width="56" height="10" rx="5" fill="#F4F7F8"/>
    <rect x="326" y="208" width="68" height="7" rx="3.5" fill="#8EA3AD"/>
    <rect x="326" y="230" width="68" height="7" rx="3.5" fill="#8EA3AD"/>
    <rect x="326" y="268" width="68" height="38" rx="10" fill="#142A3A"/>
    <path d="M338 286H382" stroke="#43D4B7" stroke-width="4" stroke-linecap="round"/>
    <text class="tiny" x="330" y="348" fill="#8DEBD6">Web Page</text>
  </g>

  <g transform="translate(510 558)">
    <rect x="0" y="0" width="260" height="54" rx="27" fill="#102035"/>
    <text class="small" x="34" y="34" fill="#FFFFFF">Supabase Auth + Storage</text>
    <path d="M284 27H342" stroke="#102035" stroke-width="3" stroke-linecap="round"/>
    <path d="M330 15L344 27L330 39" stroke="#102035" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="366" y="0" width="190" height="54" rx="27" fill="#268772"/>
